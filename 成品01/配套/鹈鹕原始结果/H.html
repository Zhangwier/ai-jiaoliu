<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  :root{
    --sky1:#bfe9ff;
    --sky2:#eafaff;
    --sun:#ffe27a;
    --hill1:#b7e3b0;
    --hill2:#8fd18a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%, #eef9ff 0%, #d9eef8 60%, #cfe6f1 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;overflow:hidden;
  }
  .frame{
    width:min(1100px,96vw);
    background:#fff;
    border-radius:24px;
    padding:18px 18px 14px;
    box-shadow:0 30px 70px -24px rgba(23,60,90,.45), 0 0 0 1px rgba(0,0,0,.04);
  }
  .frame h1{
    font-size:clamp(15px,1.6vw,19px);
    font-weight:600;color:#28455c;
    letter-spacing:.5px;margin:0 2px 10px;
    display:flex;align-items:center;gap:9px;
  }
  .frame h1::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:#ff8a5c;box-shadow:0 0 0 4px rgba(255,138,92,.18);
  }
  svg{display:block;width:100%;height:auto;border-radius:16px;background:#bfe9ff;}
  .caption{
    margin-top:10px;font-size:12px;color:#8299a9;text-align:right;letter-spacing:.4px;
  }

  /* ===== 动画关键帧 ===== */
  @keyframes scroll-x{
    from{transform:translateX(0);}
    to{transform:translateX(-240px);}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-3.2px);}
  }
  @keyframes leg-l{
    0%{transform:rotate(0deg);}
    50%{transform:rotate(-360deg);}
    100%{transform:rotate(-720deg);}
  }
  @keyframes leg-r{
    0%{transform:rotate(-40deg);}
    50%{transform:rotate(-400deg);}
    100%{transform:rotate(-760deg);}
  }
  @keyframes wing-flap{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-7deg);}
  }
  @keyframes head-bob{
    0%,100%{transform:rotate(-1.5deg);}
    50%{transform:rotate(1.8deg);}
  }
  @keyframes pouch-wobble{
    0%,100%{transform:translateY(0) scaleY(1);}
    50%{transform:translateY(1.6px) scaleY(1.07);}
  }
  @keyframes sun-pulse{
    0%,100%{opacity:.85;transform:scale(1);}
    50%{opacity:1;transform:scale(1.06);}
  }
  @keyframes cloud-drift{
    from{transform:translateX(0);}
    to{transform:translateX(-160px);}
  }
  @keyframes dust{
    0%{opacity:0;transform:translate(0,0) scale(.4);}
    25%{opacity:.55;}
    100%{opacity:0;transform:translate(-90px,-26px) scale(1.5);}
  }

  .ground-scroll{animation:scroll-x 2.2s linear infinite;}
  .cloud-a{animation:cloud-drift 26s linear infinite;}
  .cloud-b{animation:cloud-drift 38s linear infinite;}
  .sun-glow{animation:sun-pulse 4.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  .rider{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;}
  .head{animation:head-bob 1.1s ease-in-out infinite;transform-origin:50% 90%;transform-box:fill-box;}
  .pouch{animation:pouch-wobble .55s ease-in-out infinite;transform-origin:50% 10%;transform-box:fill-box;}
  .wing{animation:wing-flap .55s ease-in-out infinite;transform-origin:82% 20%;transform-box:fill-box;}
  .leg-front{animation:leg-l 1.1s linear infinite;transform-origin:center;transform-box:fill-box;}
  .leg-back{animation:leg-r 1.1s linear infinite;transform-origin:center;transform-box:fill-box;}
  .dust{animation:dust 1.4s ease-out infinite;}
  .dust:nth-child(2){animation-delay:.45s;}
  .dust:nth-child(3){animation-delay:.9s;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
  }
</style>
</head>
<body>
<div class="frame">
  <h1>鹈鹕骑自行车 · 2D SVG 动画</h1>

  <svg viewBox="0 0 1100 620" role="img" aria-label="一只鹈鹕骑着自行车向前行驶的循环动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="var(--sky1)"/>
        <stop offset="70%" stop-color="var(--sky2)"/>
        <stop offset="100%" stop-color="#fdfefb"/>
      </linearGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9aa0a8"/>
        <stop offset="100%" stop-color="#6f747b"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"  stop-color="#fff3b0" stop-opacity=".95"/>
        <stop offset="60%" stop-color="#ffe27a" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#ffe27a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#dfe9f0"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#ffc861"/>
        <stop offset="100%" stop-color="#f4952c"/>
      </linearGradient>
      <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffd98a"/>
        <stop offset="100%" stop-color="#ffb24d"/>
      </linearGradient>
      <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#3fa9f5"/>
        <stop offset="100%" stop-color="#1670c4"/>
      </linearGradient>
    </defs>

    <!-- 天空 -->
    <rect width="1100" height="620" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g class="sun-glow">
      <circle cx="905" cy="105" r="120" fill="url(#sunGlow)"/>
      <circle cx="905" cy="105" r="46" fill="var(--sun)"/>
    </g>

    <!-- 云 -->
    <g fill="#ffffff" opacity=".92">
      <g class="cloud-a">
        <g>
          <ellipse cx="180" cy="120" rx="58" ry="26"/>
          <ellipse cx="228" cy="108" rx="40" ry="30"/>
          <ellipse cx="132" cy="112" rx="34" ry="22"/>
        </g>
        <g transform="translate(420,26) scale(.8)">
          <ellipse cx="180" cy="120" rx="58" ry="26"/>
          <ellipse cx="228" cy="108" rx="40" ry="30"/>
          <ellipse cx="132" cy="112" rx="34" ry="22"/>
        </g>
      </g>
      <g class="cloud-b" opacity=".75">
        <g transform="translate(600,54) scale(.62)">
          <ellipse cx="180" cy="120" rx="58" ry="26"/>
          <ellipse cx="228" cy="108" rx="40" ry="30"/>
          <ellipse cx="132" cy="112" rx="34" ry="22"/>
        </g>
      </g>
    </g>

    <!-- 远山（慢速滚动） -->
    <g class="ground-scroll" opacity=".55">
      <path d="M-240 470 Q -180 396 120 470 T 480 470 T 840 470 T 1200 470 T 1560 470 L1560 520 L-240 520 Z" fill="var(--hill1)"/>
    </g>

    <!-- 中景灌木 -->
    <g class="ground-scroll" style="animation-duration:1.5s" opacity=".9">
      <g fill="var(--hill2)">
        <circle cx="60"  cy="470" r="34"/><circle cx="100" cy="478" r="26"/>
        <circle cx="300" cy="472" r="30"/><circle cx="338" cy="480" r="22"/>
        <circle cx="540" cy="470" r="34"/><circle cx="580" cy="479" r="24"/>
        <circle cx="780" cy="473" r="28"/><circle cx="816" cy="481" r="20"/>
        <circle cx="1020" cy="470" r="32"/><circle cx="1058" cy="480" r="23"/>
        <circle cx="-180" cy="472" r="30"/><circle cx="-142" cy="480" r="22"/>
      </g>
    </g>

    <!-- 路面 -->
    <rect x="0" y="500" width="1100" height="120" fill="url(#roadGrad)"/>
    <rect x="0" y="500" width="1100" height="6" fill="#c7ced6" opacity=".7"/>

    <!-- 路面虚线（快速滚动，形成速度感） -->
    <g class="ground-scroll" style="animation-duration:.7s">
      <g fill="#f4f1e6">
        <rect x="-240" y="566" width="70" height="9" rx="4.5"/>
        <rect x="0"    y="566" width="70" height="9" rx="4.5"/>
        <rect x="240"  y="566" width="70" height="9" rx="4.5"/>
        <rect x="480"  y="566" width="70" height="9" rx="4.5"/>
        <rect x="720"  y="566" width="70" height="9" rx="4.5"/>
        <rect x="960"  y="566" width="70" height="9" rx="4.5"/>
        <rect x="1200" y="566" width="70" height="9" rx="4.5"/>
        <rect x="1440" y="566" width="70" height="9" rx="4.5"/>
      </g>
    </g>

    <!-- 尘土 -->
    <g fill="#e8e2d4" opacity=".8">
      <circle class="dust" cx="404" cy="492" r="9"/>
      <circle class="dust" cx="392" cy="498" r="6"/>
      <circle class="dust" cx="414" cy="486" r="5"/>
    </g>

    <!-- 车影 -->
    <ellipse cx="605" cy="508" rx="205" ry="13" fill="#2b3a44" opacity=".18"/>

    <!-- ================= 自行车 + 鹈鹕 ================= -->
    <g class="rider">

      <!-- 车轮：后 -->
      <g>
        <circle cx="455" cy="430" r="78" fill="none" stroke="#2b3f52" stroke-width="9"/>
        <circle cx="455" cy="430" r="70" fill="none" stroke="#b8c4cf" stroke-width="3"/>
        <g stroke="#9fb0bf" stroke-width="3" opacity=".9">
          <line x1="455" y1="356" x2="455" y2="504"/>
          <line x1="381" y1="430" x2="529" y2="430"/>
          <line x1="403" y1="378" x2="507" y2="482"/>
          <line x1="507" y1="378" x2="403" y2="482"/>
        </g>
        <circle cx="455" cy="430" r="9" fill="#2b3f52"/>
      </g>

      <!-- 车轮：前 -->
      <g>
        <circle cx="760" cy="430" r="78" fill="none" stroke="#2b3f52" stroke-width="9"/>
        <circle cx="760" cy="430" r="70" fill="none" stroke="#b8c4cf" stroke-width="3"/>
        <g stroke="#9fb0bf" stroke-width="3" opacity=".9">
          <line x1="760" y1="356" x2="760" y2="504"/>
          <line x1="686" y1="430" x2="834" y2="430"/>
          <line x1="708" y1="378" x2="812" y2="482"/>
          <line x1="812" y1="378" x2="708" y2="482"/>
        </g>
        <circle cx="760" cy="430" r="9" fill="#2b3f52"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M455 430 L585 430 L640 318 L535 318 L455 430"/>
        <path d="M585 430 L640 318"/>
        <path d="M640 318 L702 302 L760 430"/>
        <path d="M585 430 L702 302"/>
      </g>

      <!-- 座杆 + 车座 -->
      <line x1="640" y1="318" x2="634" y2="292" stroke="#2b3f52" stroke-width="8" stroke-linecap="round"/>
      <path d="M598 288 Q634 274 672 288 Q640 300 598 288 Z" fill="#22405c"/>

      <!-- 车把 -->
      <line x1="702" y1="302" x2="712" y2="262" stroke="#2b3f52" stroke-width="8" stroke-linecap="round"/>
      <path d="M712 262 Q748 250 764 268" fill="none" stroke="#2b3f52" stroke-width="9" stroke-linecap="round"/>
      <circle cx="764" cy="268" r="7" fill="#22405c"/>

      <!-- 曲柄 + 齿盘 + 踏板 -->
      <circle cx="585" cy="430" r="26" fill="#dbe4ec" stroke="#2b3f52" stroke-width="4"/>
      <circle cx="585" cy="430" r="7" fill="#2b3f52"/>

      <!-- 后飞轮 -->
      <circle cx="455" cy="430" r="14" fill="none" stroke="#7d8f9e" stroke-width="4"/>

      <!-- ===== 鹈鹕 腿（后） ===== -->
      <g class="leg-back" transform="translate(585,430)">
        <line x1="0" y1="0" x2="26" y2="26" stroke="#e8912c" stroke-width="11" stroke-linecap="round"/>
        <line x1="26" y1="26" x2="6" y2="48" stroke="#e8912c" stroke-width="10" stroke-linecap="round"/>
        <path d="M6 48 l26 6 l-6 8 l-28 -4 z" fill="#d98420"/>
      </g>

      <!-- ===== 鹈鹕 身体 ===== -->
      <g>
        <!-- 尾羽 -->
        <path d="M556 240 Q520 232 502 250 Q524 262 552 262 Z" fill="#cbd8e2"/>
        <!-- 躯干 -->
        <ellipse cx="612" cy="268" rx="78" ry="62" fill="url(#bodyGrad)" stroke="#c3d1dc" stroke-width="2"/>
        <!-- 腹部阴影 -->
        <path d="M556 300 Q612 336 672 300 Q640 322 612 322 Q584 322 556 300 Z" fill="#c9d7e2" opacity=".55"/>
        <!-- 脖子 -->
        <path d="M660 244 Q690 194 704 168 Q718 142 748 146"
              fill="none" stroke="#f3f7fa" stroke-width="30" stroke-linecap="round"/>
        <path d="M660 244 Q690 194 704 168 Q718 142 748 146"
              fill="none" stroke="#dbe7ef" stroke-width="30" stroke-linecap="round" opacity=".35"/>

        <!-- 头部 + 喙 -->
        <g class="head">
          <ellipse cx="760" cy="146" rx="35" ry="32" fill="#fdfefe" stroke="#c3d1dc" stroke-width="2"/>
          <path d="M748 118 q10 -18 22 -6 q-6 6 -22 6 z" fill="#eaf1f6"/>
          <path d="M788 138 Q862 146 900 172 Q862 178 786 158 Z"
                fill="url(#beakGrad)" stroke="#d9821f" stroke-width="2" stroke-linejoin="round"/>
          <path d="M898 170 q10 4 2 12 q-8 -2 -10 -8 z" fill="#e8912c"/>
          <path class="pouch" d="M790 158 Q820 216 866 186 Q898 176 898 174 Q862 180 786 158 Z"
                fill="url(#pouchGrad)" stroke="#e09a35" stroke-width="2" stroke-linejoin="round"/>
          <ellipse cx="820" cy="146" rx="4" ry="2.4" fill="#c1741a" opacity=".8"/>
          <circle cx="778" cy="138" r="9.5" fill="#ffffff" stroke="#c3d1dc" stroke-width="1.5"/>
          <circle cx="780" cy="138" r="5.6" fill="#263b4d"/>
          <circle cx="782" cy="136" r="1.9" fill="#ffffff"/>
          <ellipse cx="766" cy="160" rx="13" ry="8" fill="#ffc3b0" opacity=".55"/>
        </g>

        <!-- ===== 翅膀（握把） ===== -->
        <g class="wing">
          <path d="M566 250 Q600 200 668 216 Q712 226 744 252 Q712 268 660 268 Q606 268 566 250 Z"
                fill="#eef4f8" stroke="#c3d1dc" stroke-width="2.5"/>
          <path d="M600 252 Q648 240 700 250" fill="none" stroke="#d3e0e9" stroke-width="3" stroke-linecap="round"/>
          <path d="M612 262 Q656 252 706 260" fill="none" stroke="#d3e0e9" stroke-width="3" stroke-linecap="round"/>
          <path d="M744 252 q22 2 26 16 q-14 8 -30 -2 z" fill="#e3ecf3" stroke="#c3d1dc" stroke-width="2"/>
        </g>
      </g>

      <!-- ===== 鹈鹕 腿（前） ===== -->
      <g class="leg-front" transform="translate(585,430)">
        <line x1="0" y1="0" x2="-28" y2="20" stroke="#f6a338" stroke-width="11" stroke-linecap="round"/>
        <line x1="-28" y1="20" x2="-10" y2="46" stroke="#f6a338" stroke-width="10" stroke-linecap="round"/>
        <path d="M-10 46 l28 4 l-8 9 l-28 -3 z" fill="#e8912c"/>
      </g>

      <!-- 曲柄连杆 -->
      <line x1="585" y1="430" x2="559" y2="450" stroke="#2b3f52" stroke-width="7" stroke-linecap="round"/>
      <line x1="585" y1="430" x2="611" y2="410" stroke="#2b3f52" stroke-width="7" stroke-linecap="round"/>
      <rect x="547" y="446" width="26" height="8" rx="4" fill="#22405c"/>
      <rect x="599" y="404" width="26" height="8" rx="4" fill="#22405c"/>

      <!-- 车筐 + 小鱼 -->
      <g transform="translate(736,236)">
        <path d="M6 0 L54 0 L48 42 L12 42 Z" fill="#e6b06a" stroke="#b9832f" stroke-width="2.5"/>
        <line x1="6" y1="14" x2="54" y2="14" stroke="#b9832f" stroke-width="2"/>
        <line x1="7" y1="28" x2="53" y2="28" stroke="#b9832f" stroke-width="2"/>
        <line x1="20" y1="0" x2="22" y2="42" stroke="#b9832f" stroke-width="1.6" opacity=".7"/>
        <line x1="34" y1="0" x2="33" y2="42" stroke="#b9832f" stroke-width="1.6" opacity=".7"/>
        <path d="M24 -4 q14 -14 22 4 q-12 6 -22 -4 z" fill="#7fc3e8" stroke="#4a9cc9" stroke-width="2"/>
      </g>
    </g>

    <!-- 前景草 -->
    <g fill="#7ec47c" opacity=".9">
      <path d="M40 502 q6 -22 14 0 q6 -16 12 0 z"/>
      <path d="M210 502 q7 -24 15 0 q7 -17 13 0 z"/>
      <path d="M400 502 q6 -20 13 0 q6 -15 12 0 z"/>
      <path d="M640 502 q7 -23 14 0 q7 -16 13 0 z"/>
      <path d="M860 502 q6 -21 13 0 q6 -15 12 0 z"/>
      <path d="M1010 502 q7 -24 15 0 q7 -17 13 0 z"/>
    </g>
  </svg>

  <div class="caption">纯 SVG + CSS 关键帧动画 · 无外部依赖</div>
</div>
</body>
</html>
