<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑行 · Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10202b;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  body { display: grid; place-items: center; }
  .stage {
    width: min(96vw, 1100px);
    aspect-ratio: 900 / 560;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06);
    background: #cfe6f4;
  }
  svg { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; color: rgba(255,255,255,.32);
    font-size: 12px; letter-spacing: .32em; user-select: none;
  }
</style>
</head>
<body>

<div class="stage">
<svg id="scene" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只鹈鹕骑着自行车向前行驶的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9fd0ea"/>
      <stop offset="46%"  stop-color="#cfe6f4"/>
      <stop offset="78%"  stop-color="#fbe7c6"/>
      <stop offset="100%" stop-color="#f9d9b0"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff4cf" stop-opacity=".95"/>
      <stop offset="45%"  stop-color="#ffdf9b" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffdf9b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9d3c4"/><stop offset="100%" stop-color="#9dbdaa"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93b894"/><stop offset="100%" stop-color="#7ba37e"/>
    </linearGradient>

    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d8288"/><stop offset="100%" stop-color="#5d636a"/>
    </linearGradient>

    <linearGradient id="feather" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#fbf7ee"/>
      <stop offset="100%" stop-color="#e9e0cf"/>
    </linearGradient>

    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffc247"/>
      <stop offset="65%"  stop-color="#f6a12a"/>
      <stop offset="100%" stop-color="#e8871a"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffcf6b"/>
      <stop offset="100%" stop-color="#f0a83c"/>
    </linearGradient>

    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b9cb0"/><stop offset="100%" stop-color="#16707f"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect width="900" height="560" fill="url(#sky)"/>
  <circle cx="742" cy="128" r="150" fill="url(#sunGlow)"/>
  <circle cx="742" cy="128" r="42" fill="#ffe9ad" opacity=".95"/>

  <!-- ============ 云 ============ -->
  <g id="clouds" fill="#ffffff" opacity=".82" filter="url(#soft)">
    <g id="cl1">
      <ellipse cx="150" cy="120" rx="58" ry="24"/>
      <ellipse cx="196" cy="108" rx="44" ry="30"/>
      <ellipse cx="238" cy="122" rx="40" ry="20"/>
    </g>
    <g id="cl2">
      <ellipse cx="520" cy="80" rx="46" ry="18"/>
      <ellipse cx="556" cy="70" rx="34" ry="24"/>
      <ellipse cx="590" cy="82" rx="30" ry="15"/>
    </g>
    <g id="cl3">
      <ellipse cx="790" cy="210" rx="52" ry="18"/>
      <ellipse cx="826" cy="200" rx="34" ry="22"/>
    </g>
  </g>

  <!-- ============ 远山 ============ -->
  <g id="hillsFar" opacity=".85">
    <path d="M-60 420 C 60 330, 150 342, 236 372 C 320 402, 392 316, 500 352 C 596 384, 660 340, 760 366 C 830 384, 880 372, 960 392 L 960 470 L -60 470 Z"
          fill="url(#hillFar)"/>
  </g>
  <g id="hillsNear">
    <path d="M-60 452 C 40 404, 132 418, 210 438 C 300 460, 372 400, 470 424 C 566 448, 640 418, 726 436 C 812 454, 880 440, 960 452 L 960 480 L -60 480 Z"
          fill="url(#hillNear)"/>
  </g>

  <!-- ============ 路面 ============ -->
  <rect x="0" y="466" width="900" height="94" fill="url(#roadG)"/>
  <rect x="0" y="466" width="900" height="4" fill="#8f959b"/>
  <g id="dashes" opacity=".9">
    <rect x="-100" y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="60"   y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="220"  y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="380"  y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="540"  y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="700"  y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="860"  y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
    <rect x="1020" y="510" width="54" height="7" rx="3.5" fill="#f0e6d2"/>
  </g>

  <!-- 速度线 -->
  <g id="speedlines" stroke="#ffffff" stroke-linecap="round" opacity=".55">
    <line x1="150" y1="300" x2="212" y2="300" stroke-width="4"/>
    <line x1="108" y1="340" x2="184" y2="340" stroke-width="5"/>
    <line x1="164" y1="382" x2="214" y2="382" stroke-width="3.5"/>
  </g>

  <!-- ============ 主体 ============ -->
  <g id="rig">

    <!-- 地面阴影 -->
    <ellipse cx="436" cy="472" rx="196" ry="13" fill="#2b333a" opacity=".18" filter="url(#soft)"/>

    <!-- 远侧腿（在车架后面） -->
    <g id="legFar" opacity=".82">
      <line id="thighF" x1="0" y1="0" x2="0" y2="0" stroke="#c97f13" stroke-width="13" stroke-linecap="round"/>
      <line id="shinF"  x1="0" y1="0" x2="0" y2="0" stroke="#c97f13" stroke-width="8"  stroke-linecap="round"/>
      <g id="footF">
        <path d="M -3 0 L 15 0 Q 23 0 23 5 L 6 8 Q -3 8 -3 0 Z" fill="#c97f13"/>
      </g>
    </g>

    <!-- ===== 自行车 ===== -->
    <g id="bike">
      <!-- 后轮 -->
      <g>
        <circle cx="300" cy="408" r="62" fill="none" stroke="#2f3b45" stroke-width="8"/>
        <circle cx="300" cy="408" r="55" fill="none" stroke="#aeb9c2" stroke-width="3"/>
        <g id="rearSpokes" stroke="#b9c4cc" stroke-width="2.4" stroke-linecap="round">
          <line x1="300" y1="356" x2="300" y2="460"/>
          <line x1="248" y1="408" x2="352" y2="408"/>
          <line x1="263" y1="371" x2="337" y2="445"/>
          <line x1="263" y1="445" x2="337" y2="371"/>
          <line x1="284" y1="358" x2="316" y2="458"/>
          <line x1="316" y1="358" x2="284" y2="458"/>
          <line x1="252" y1="386" x2="348" y2="430"/>
          <line x1="252" y1="430" x2="348" y2="386"/>
        </g>
        <circle cx="300" cy="408" r="7" fill="#6b7883"/>
      </g>

      <!-- 前轮 -->
      <g>
        <circle cx="560" cy="408" r="62" fill="none" stroke="#2f3b45" stroke-width="8"/>
        <circle cx="560" cy="408" r="55" fill="none" stroke="#aeb9c2" stroke-width="3"/>
        <g id="frontSpokes" stroke="#b9c4cc" stroke-width="2.4" stroke-linecap="round">
          <line x1="560" y1="356" x2="560" y2="460"/>
          <line x1="508" y1="408" x2="612" y2="408"/>
          <line x1="523" y1="371" x2="597" y2="445"/>
          <line x1="523" y1="445" x2="597" y2="371"/>
          <line x1="544" y1="358" x2="576" y2="458"/>
          <line x1="576" y1="358" x2="544" y2="458"/>
          <line x1="512" y1="386" x2="608" y2="430"/>
          <line x1="512" y1="430" x2="608" y2="386"/>
        </g>
        <circle cx="560" cy="408" r="7" fill="#6b7883"/>
      </g>

      <!-- 链条 -->
      <line x1="300" y1="400" x2="440" y2="396" stroke="#5d6a74" stroke-width="3"/>
      <line x1="300" y1="416" x2="440" y2="428" stroke="#5d6a74" stroke-width="3"/>

      <!-- 车架 -->
      <g stroke="url(#frameG)" stroke-width="10" stroke-linecap="round" fill="none">
        <line x1="300" y1="408" x2="440" y2="412"/>   <!-- 下叉 -->
        <line x1="300" y1="408" x2="374" y2="304"/>   <!-- 后上叉 -->
        <line x1="440" y1="412" x2="376" y2="302"/>   <!-- 立管 -->
        <line x1="376" y1="302" x2="546" y2="312"/>   <!-- 上管 -->
        <line x1="440" y1="412" x2="534" y2="396"/>   <!-- 下管 -->
        <line x1="546" y1="312" x2="534" y2="396"/>   <!-- 头管 -->
        <line x1="534" y1="396" x2="560" y2="408"/>   <!-- 前叉 -->
      </g>
      <!-- 车把 -->
      <g stroke="#16707f" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="546" y1="312" x2="552" y2="292"/>
        <path d="M 552 292 C 566 284, 580 286, 588 296"/>
      </g>
      <circle cx="590" cy="298" r="6" fill="#0f5763"/>
      <!-- 车铃 -->
      <circle cx="536" cy="306" r="7" fill="#e8b23c"/>
      <circle cx="534" cy="304" r="2.4" fill="#fff2c9" opacity=".8"/>

      <!-- 车座 -->
      <path d="M 344 300 Q 372 288 400 298 Q 398 311 370 312 Q 348 312 344 300 Z" fill="#3b4b57"/>

      <!-- 曲柄 + 脚踏 -->
      <g id="crank">
        <circle cx="440" cy="412" r="20" fill="none" stroke="#7c8894" stroke-width="4"/>
        <circle cx="440" cy="412" r="20" fill="none" stroke="#aab6c0" stroke-width="1.5" stroke-dasharray="2 5"/>
        <line x1="440" y1="412" x2="464" y2="412" stroke="#6b7883" stroke-width="7" stroke-linecap="round"/>
        <line x1="440" y1="412" x2="416" y2="412" stroke="#6b7883" stroke-width="7" stroke-linecap="round"/>
        <g id="pedalA" transform="translate(464 412)">
          <rect x="-11" y="-3.5" width="22" height="7" rx="2.5" fill="#39434d"/>
        </g>
        <g id="pedalB" transform="translate(416 412)">
          <rect x="-11" y="-3.5" width="22" height="7" rx="2.5" fill="#39434d"/>
        </g>
        <circle cx="440" cy="412" r="6" fill="#4d5a66"/>
      </g>
    </g>

    <!-- 近侧腿（在车架前面） -->
    <g id="legNear">
      <line id="thighN" x1="0" y1="0" x2="0" y2="0" stroke="#f39c12" stroke-width="15" stroke-linecap="round"/>
      <line id="shinN"  x1="0" y1="0" x2="0" y2="0" stroke="#f39c12" stroke-width="9.5" stroke-linecap="round"/>
      <g id="footN">
        <path d="M -4 0 L 17 0 Q 26 0 26 5.5 L 7 9 Q -4 9 -4 0 Z" fill="#f39c12"/>
        <path d="M 2 1 L 8 8 M 10 1 L 15 8" stroke="#d9820a" stroke-width="1.4" opacity=".7"/>
      </g>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M 312 250 L 258 236 L 276 262 L 252 276 L 316 274 Z" fill="#e6ddcc"/>

      <!-- 身体 -->
      <ellipse cx="356" cy="252" rx="62" ry="48" fill="url(#feather)" transform="rotate(-11 356 252)"/>
      <path d="M 300 268 C 318 292, 366 302, 404 282 C 392 300, 340 306, 306 288 Z" fill="#e9e0cf" opacity=".75"/>

      <!-- 脖子 -->
      <path d="M 380 240 C 392 202, 416 178, 444 164 L 464 180 C 438 194, 416 214, 408 246 Z" fill="url(#feather)"/>

      <!-- 翅膀 -->
      <g id="wing">
        <path d="M 330 228 C 362 212, 396 222, 400 250 C 404 276, 374 294, 344 288 C 318 282, 310 246, 330 228 Z" fill="#f4eee2"/>
        <path d="M 340 246 C 358 240, 378 244, 388 254 M 336 262 C 354 258, 374 260, 386 268"
              stroke="#d9cfbc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M 330 228 C 362 212, 396 222, 400 250" stroke="#ffffff" stroke-width="3" fill="none" opacity=".8"/>
      </g>

      <!-- 头 -->
      <g id="head">
        <ellipse cx="466" cy="158" rx="26" ry="23" fill="url(#feather)" transform="rotate(-8 466 158)"/>
        <!-- 头顶小冠 -->
        <path d="M 452 138 C 448 128, 456 122, 462 130 C 466 122, 474 126, 472 136 Z" fill="#f0e6d4"/>

        <!-- 上喙 -->
        <path d="M 484 144 Q 552 146 620 166 Q 554 172 484 160 Z" fill="url(#beakG)"/>
        <path d="M 484 144 Q 552 146 620 166" stroke="#e8871a" stroke-width="2" fill="none" opacity=".55"/>
        <!-- 喉囊 -->
        <path d="M 487 158 Q 536 214 616 170 Q 552 184 487 162 Z" fill="url(#pouchG)"/>
        <path d="M 500 170 Q 540 194 592 178" stroke="#e79a2e" stroke-width="2" fill="none" opacity=".5"/>

        <!-- 眼 -->
        <circle cx="474" cy="146" r="5.4" fill="#2b2b2b"/>
        <circle cx="476" cy="144" r="1.7" fill="#ffffff" opacity=".95"/>
        <path d="M 466 138 Q 474 134 482 138" stroke="#c9bda8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
</div>

<div class="caption">PELICAN · RIDE</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const GROUND = 470;
  const REAR = { x: 300, y: 408, r: 62 };
  const FRONT = { x: 560, y: 408, r: 62 };
  const BB = { x: 440, y: 412 };        // 中轴
  const CRANK_R = 24;
  const HIP_N = { x: 384, y: 298 };     // 近侧腿髋部
  const HIP_F = { x: 378, y: 302 };     // 远侧腿髋部
  const L1 = 78, L2 = 82;               // 大腿 / 小腿

  const rearSpokes = $('rearSpokes'), frontSpokes = $('frontSpokes');
  const crank = $('crank'), pedalA = $('pedalA'), pedalB = $('pedalB');
  const wing = $('wing'), head = $('head'), rig = $('rig');
  const dashes = $('dashes'), speedlines = $('speedlines');
  const clouds = [$('cl1'), $('cl2'), $('cl3')];
  const cloudX = [0, 0, 0];
  const cloudSpd = [10, 17, 26];

  const legs = {
    near: { thigh: $('thighN'), shin: $('shinN'), foot: $('footN'), hip: HIP_N, sign: -1, w: 0 },
    far:  { thigh: $('thighF'), shin: $('shinF'), foot: $('footF'), hip: HIP_F, sign: -1, w: 0 }
  };

  // 两段式反向运动学：已知髋与脚，求膝
  function solveKnee(hip, foot, l1, l2, sign) {
    let dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy) || 0.0001;
    const dClamp = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.5);
    const ux = dx / d, uy = dy / d;
    const a = (l1 * l1 - l2 * l2 + dClamp * dClamp) / (2 * dClamp);
    const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    return {
      x: hip.x + ux * a - uy * h * sign,
      y: hip.y + uy * a + ux * h * sign
    };
  }

  function setLeg(L, footPos, tilt) {
    const knee = solveKnee(L.hip, footPos, L1, L2, L.sign);
    L.thigh.setAttribute('x1', L.hip.x);  L.thigh.setAttribute('y1', L.hip.y);
    L.thigh.setAttribute('x2', knee.x);   L.thigh.setAttribute('y2', knee.y);
    L.shin.setAttribute('x1', knee.x);    L.shin.setAttribute('y1', knee.y);
    L.shin.setAttribute('x2', footPos.x); L.shin.setAttribute('y2', footPos.y);
    L.foot.setAttribute('transform', `translate(${footPos.x} ${footPos.y}) rotate(${tilt})`);
  }

  let t = 0, wheelAng = 0, crankAng = 0, dist = 0;
  let last = performance.now();

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    t += dt;

    const SPEED = 235;                       // 前进速度 px/s
    dist += SPEED * dt;
    wheelAng += (SPEED / REAR.r) * dt * 180 / Math.PI;
    crankAng += 168 * dt;                    // 踏频

    // 车轮
    rearSpokes.setAttribute('transform', `rotate(${wheelAng} ${REAR.x} ${REAR.y})`);
    frontSpokes.setAttribute('transform', `rotate(${wheelAng} ${FRONT.x} ${FRONT.y})`);

    // 曲柄与脚踏（脚踏反向自转保持水平）
    crank.setAttribute('transform', `rotate(${crankAng} ${BB.x} ${BB.y})`);
    pedalA.setAttribute('transform', `translate(464 412) rotate(${-crankAng})`);
    pedalB.setAttribute('transform', `translate(416 412) rotate(${-crankAng})`);

    const rad = crankAng * Math.PI / 180;
    const pA = { x: BB.x + CRANK_R * Math.cos(rad), y: BB.y + CRANK_R * Math.sin(rad) };
    const pB = { x: BB.x - CRANK_R * Math.cos(rad), y: BB.y - CRANK_R * Math.sin(rad) };

    setLeg(legs.near, pA, -crankAng * 0.55);
    setLeg(legs.far,  pB, -crankAng * 0.55 + 8);

    // 整体起伏与点头
    const bob = Math.sin(t * 4.2) * 2.4;
    rig.setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${(Math.sin(t * 4.2) * 0.5).toFixed(3)} 440 412)`);

    wing.setAttribute('transform', `rotate(${(Math.sin(t * 3.1) * 4).toFixed(2)} 340 240)`);
    head.setAttribute('transform', `rotate(${(Math.sin(t * 4.2 + 0.8) * 2.2).toFixed(2)} 452 176)`);

    // 路面虚线
    const period = 160;
    dashes.setAttribute('transform', `translate(${-(dist % period)} 0)`);

    // 速度线
    const sl = Math.sin(t * 6);
    speedlines.setAttribute('opacity', (0.35 + 0.3 * sl).toFixed(2));
    speedlines.setAttribute('transform', `translate(${-(dist % 40) * 0.4} 0)`);

    // 云
    clouds.forEach((c, i) => {
      cloudX[i] -= cloudSpd[i] * dt;
      const span = 1000;
      const x = ((cloudX[i] % span) + span) % span;
      const shift = x > 500 ? x - span : x;
      c.setAttribute('transform', `translate(${(-60 - shift * 0.06).toFixed(2)} 0)`);
      c.setAttribute('opacity', (0.55 + 0.25 * Math.sin(t * 0.6 + i)).toFixed(2));
    });

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
