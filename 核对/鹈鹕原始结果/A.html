<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #22262e 0%, #2e3540 100%);
    font-family: "Microsoft YaHei", sans-serif;
  }
  svg {
    width: 92vw;
    max-width: 920px;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车在公路上前进的2D动画">
  <desc>鹈鹕骑自行车：车轮旋转、双腿蹬踏板、云朵飘动、路面虚线滚动、小红旗飘扬</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f7"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6472"/>
      <stop offset="1" stop-color="#3d4450"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe469" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe469" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="400" fill="url(#sky)"/>

  <!-- 太阳与光芒 -->
  <g>
    <circle cx="96" cy="88" r="60" fill="url(#sunGlow)"/>
    <circle cx="96" cy="88" r="33" fill="#ffd93b"/>
    <g stroke="#ffd93b" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 96 88" to="360 96 88" dur="40s" repeatCount="indefinite"/>
      <line x1="96" y1="40" x2="96" y2="28"/>
      <line x1="96" y1="136" x2="96" y2="148"/>
      <line x1="48" y1="88" x2="36" y2="88"/>
      <line x1="144" y1="88" x2="156" y2="88"/>
      <line x1="62" y1="54" x2="53" y2="45"/>
      <line x1="130" y1="122" x2="139" y2="131"/>
      <line x1="62" y1="122" x2="53" y2="131"/>
      <line x1="130" y1="54" x2="139" y2="45"/>
    </g>
  </g>

  <!-- 云朵（循环飘动） -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="900 62; -280 62" dur="58s" begin="-12s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="48" ry="20"/>
      <ellipse cx="32" cy="-12" rx="34" ry="17"/>
      <ellipse cx="-34" cy="-6" rx="30" ry="14"/>
    </g>
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="900 128; -260 128" dur="82s" begin="-45s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="40" ry="16"/>
      <ellipse cx="26" cy="-10" rx="26" ry="13"/>
      <ellipse cx="-28" cy="-4" rx="24" ry="12"/>
    </g>
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="900 34; -240 34" dur="70s" begin="-30s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="34" ry="13"/>
      <ellipse cx="22" cy="-8" rx="22" ry="11"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0,400 Q170,322 360,400 T800,400 Z" fill="#b7e2a0"/>
  <path d="M-40,400 Q190,352 440,400 T860,400 Z" fill="#9ed17f"/>

  <!-- 公路 -->
  <rect x="0" y="400" width="800" height="68" fill="url(#road)"/>
  <line x1="0" y1="402" x2="800" y2="402" stroke="#eef2f5" stroke-width="2.5" opacity="0.85"/>
  <!-- 中央黄色虚线（滚动） -->
  <line x1="0" y1="434" x2="800" y2="434" stroke="#fbd048" stroke-width="6" stroke-dasharray="42 36">
    <animate attributeName="stroke-dashoffset" from="0" to="78" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="464" x2="800" y2="464" stroke="#eef2f5" stroke-width="2.5" opacity="0.85"/>

  <!-- 前景草地 -->
  <rect x="0" y="468" width="800" height="32" fill="#7cbf5e"/>
  <text x="400" y="489" text-anchor="middle" font-size="15" fill="#2d4a1f" opacity="0.6" font-family="Microsoft YaHei, sans-serif">鹈鹕骑行记 · Pelican on a Bike</text>

  <!-- 车后速度线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="270" x2="188" y2="270" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -130 0" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="132" y1="314" x2="174" y2="314" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -130 0" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
    </line>
    <line x1="148" y1="356" x2="186" y2="356" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0; -130 0" dur="0.8s" begin="0.54s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="0.8s" begin="0.54s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="355" cy="403" rx="195" ry="8" fill="#000000" opacity="0.15"/>

  <!-- ============ 自行车 + 鹈鹕 ============ -->

  <!-- 小红旗（车尾） -->
  <line x1="256" y1="252" x2="230" y2="152" stroke="#8d5524" stroke-width="3" stroke-linecap="round"/>
  <polygon points="230,152 230,180 196,166" fill="#ff6b6b" stroke="#e25555" stroke-width="1.5">
    <animate attributeName="points"
      values="230,152 230,180 196,166;
              230,152 230,180 203,171;
              230,152 230,180 196,166"
      dur="0.55s" repeatCount="indefinite"/>
  </polygon>

  <!-- 后轮 -->
  <g transform="translate(230 345)">
    <circle r="55" fill="none" stroke="#2f3542" stroke-width="9"/>
    <circle r="47" fill="none" stroke="#aab2bd" stroke-width="3"/>
    <g stroke="#c8ccd4" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <line x1="-45" y1="0" x2="45" y2="0"/>
      <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(60)"/>
      <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(120)"/>
    </g>
    <circle r="6.5" fill="#57606f"/>
  </g>

  <!-- 前轮 -->
  <g transform="translate(480 345)">
    <circle r="55" fill="none" stroke="#2f3542" stroke-width="9"/>
    <circle r="47" fill="none" stroke="#aab2bd" stroke-width="3"/>
    <g stroke="#c8ccd4" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <line x1="-45" y1="0" x2="45" y2="0"/>
      <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(60)"/>
      <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(120)"/>
    </g>
    <circle r="6.5" fill="#57606f"/>
  </g>

  <!-- 远侧腿（鹈鹕左腿，位于车身之后） -->
  <polyline points="308,245 332,294 312,340" fill="none" stroke="#d17f24" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="points" dur="0.9s" repeatCount="indefinite" values="
      308,245 332,294 312,340;
      308,245 342,284 320.2,320.2;
      308,245 352,280 340,312;
      308,245 350,286 359.8,320.2;
      308,245 350,292 368,340;
      308,245 344,300 359.8,359.8;
      308,245 334,306 340,368;
      308,245 328,300 320.2,359.8;
      308,245 332,294 312,340"/>
  </polyline>

  <!-- 远侧曲柄 + 踏板 + 蹼足（保持水平绕轴旋转） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 340 340" to="360 340 340" dur="0.9s" repeatCount="indefinite"/>
    <line x1="340" y1="340" x2="312" y2="340" stroke="#41495a" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(312 340)">
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-360" dur="0.9s" repeatCount="indefinite"/>
      <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#41495a"/>
      <ellipse cx="1" cy="-5.5" rx="11" ry="5.5" fill="#d17f24"/>
    </g>
  </g>

  <!-- 车架 -->
  <g stroke="#e84545" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="230" y1="345" x2="340" y2="340"/>   <!-- 后下叉 -->
    <line x1="340" y1="340" x2="285" y2="252"/>   <!-- 座管 -->
    <line x1="230" y1="345" x2="285" y2="252"/>   <!-- 后上叉 -->
    <line x1="285" y1="252" x2="462" y2="248"/>   <!-- 上管 -->
    <line x1="340" y1="340" x2="460" y2="256"/>   <!-- 下管 -->
    <line x1="462" y1="248" x2="480" y2="345"/>   <!-- 前叉 -->
    <line x1="462" y1="248" x2="454" y2="234"/>   <!-- 立管 -->
    <path d="M454,234 q-10,2 -12,11" stroke-width="6"/> <!-- 车把 -->
  </g>
  <circle cx="442" cy="245" r="4" fill="#2d3436"/> <!-- 握把端 -->
  <!-- 链条与牙盘 -->
  <line x1="230" y1="339" x2="340" y2="325" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" from="0" to="-9" dur="0.35s" repeatCount="indefinite"/>
  </line>
  <line x1="230" y1="351" x2="340" y2="355" stroke="#7f8c8d" stroke-width="2.5" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" from="0" to="9" dur="0.35s" repeatCount="indefinite"/>
  </line>
  <circle cx="340" cy="340" r="15" fill="none" stroke="#57606f" stroke-width="3.5"/>
  <circle cx="230" cy="345" r="6" fill="none" stroke="#57606f" stroke-width="3"/>
  <!-- 车座 -->
  <ellipse cx="284" cy="248" rx="17" ry="6" fill="#34495e"/>

  <!-- 近侧腿（鹈鹕右腿，位于车身之前） -->
  <polyline points="308,245 350,292 368,340" fill="none" stroke="#f28c28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="points" dur="0.9s" repeatCount="indefinite" values="
      308,245 350,292 368,340;
      308,245 344,300 359.8,359.8;
      308,245 334,306 340,368;
      308,245 328,300 320.2,359.8;
      308,245 332,294 312,340;
      308,245 342,284 320.2,320.2;
      308,245 352,280 340,312;
      308,245 350,286 359.8,320.2;
      308,245 350,292 368,340"/>
  </polyline>

  <!-- 近侧曲柄 + 踏板 + 蹼足 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 340 340" to="360 340 340" dur="0.9s" repeatCount="indefinite"/>
    <line x1="340" y1="340" x2="368" y2="340" stroke="#57606f" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(368 340)">
      <animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="-360" dur="0.9s" repeatCount="indefinite"/>
      <rect x="-11" y="-2.5" width="22" height="5" rx="2" fill="#57606f"/>
      <ellipse cx="1" cy="-6" rx="12" ry="6" fill="#f28c28"/>
    </g>
  </g>

  <!-- ============ 鹈鹕 ============ -->

  <!-- 尾羽 -->
  <path d="M252,196 L214,176 L236,198 L208,196 L238,208 L216,222 L250,212 Z"
        fill="#e9ecef" stroke="#d0d7de" stroke-width="2" stroke-linejoin="round"/>

  <!-- 身体 -->
  <ellipse cx="300" cy="206" rx="62" ry="44" fill="#fdfdfd" stroke="#d8d8d8" stroke-width="2.5" transform="rotate(-6 300 206)"/>
  <!-- 收拢的翅膀纹理 -->
  <ellipse cx="288" cy="202" rx="34" ry="21" fill="#f1f3f5" stroke="#dde2e6" stroke-width="1.5" transform="rotate(-14 288 202)"/>
  <path d="M270,196 q22,-8 44,2 M266,206 q26,-8 50,4" fill="none" stroke="#dde2e6" stroke-width="2" stroke-linecap="round"/>

  <!-- 脖子（描边+填充双层） -->
  <path d="M334,182 C346,150 364,128 390,119" fill="none" stroke="#e3e6e8" stroke-width="21" stroke-linecap="round"/>
  <path d="M334,182 C346,150 364,128 390,119" fill="none" stroke="#fdfdfd" stroke-width="16" stroke-linecap="round"/>

  <!-- 头部（带轻微点头动画） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.6 398 130; 1.6 398 130; -1.6 398 130" dur="0.9s" repeatCount="indefinite"/>
    <!-- 头顶小翎毛 -->
    <path d="M384,102 q-7,-10 -16,-11 M389,99 q-3,-12 -11,-16" fill="none" stroke="#d8d8d8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="398" cy="118" r="19" fill="#fdfdfd" stroke="#d8d8d8" stroke-width="2.5"/>
    <!-- 喉囊（下喙） -->
    <path d="M410,126 C430,172 466,168 494,136 C468,142 436,140 410,132 Z"
          fill="#f8842c" stroke="#e06d1f" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 上喙 -->
    <path d="M410,110 L496,132 L408,128 Z" fill="#ffb25e" stroke="#e08a3c" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="416" y1="118" x2="442" y2="124" stroke="#e08a3c" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 眼睛（会眨） -->
    <ellipse cx="405" cy="107" rx="3.6" ry="3.6" fill="#2d3436">
      <animate attributeName="ry" values="3.6;3.6;0.4;3.6" keyTimes="0;0.86;0.93;1" dur="4.6s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="406.6" cy="105.4" r="1.2" fill="#ffffff"/>
  </g>

  <!-- 翅膀扶在车把上 -->
  <path d="M322,182 C360,176 420,198 456,232 C462,239 457,248 448,246 C414,237 360,224 318,212 C312,208 314,184 322,182 Z"
        fill="#e9ecef" stroke="#d0d7de" stroke-width="2" stroke-linejoin="round"/>
  <path d="M330,196 q40,-2 82,24" fill="none" stroke="#d0d7de" stroke-width="2" stroke-linecap="round"/>
  <path d="M326,205 q42,0 84,26" fill="none" stroke="#d0d7de" stroke-width="2" stroke-linecap="round"/>

</svg>

</body>
</html>
