<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root { --bg:#0d1117; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% 20%, #1b2735 0%, var(--bg) 70%);
    display: grid;
    place-items: center;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #cfd8e3;
  }
  .stage {
    width: min(96vw, 1040px);
    aspect-ratio: 900 / 520;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.07);
  }
  svg { display: block; width: 100%; height: 100%; }
  .bar {
    display: flex; align-items: center; gap: 14px;
    width: min(96vw, 1040px); margin-top: 14px; font-size: 13px;
  }
  button {
    background: #14b8a6; color: #04211e; border: 0; border-radius: 999px;
    padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .hint { opacity: .55; }
</style>
</head>
<body>

<div class="stage">
<svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只戴头盔、系红围巾的鹈鹕正在骑一辆公路自行车">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7ec8f2"/>
      <stop offset="55%"  stop-color="#bfe6f7"/>
      <stop offset="100%" stop-color="#fdf0d5"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff6c9" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52606d"/>
      <stop offset="100%" stop-color="#333f4a"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#ddd0b4"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4791f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- 可复用的云 -->
    <g id="cloud">
      <ellipse cx="0"  cy="0"  rx="34" ry="20" fill="#fff"/>
      <ellipse cx="26" cy="6"  rx="26" ry="16" fill="#fff"/>
      <ellipse cx="-26" cy="7" rx="24" ry="15" fill="#fff"/>
      <ellipse cx="6"  cy="-12" rx="22" ry="16" fill="#fff"/>
    </g>

    <!-- 可复用的车轮：轮心 (0,0)，轮圈 R70 / 辐条 R60，周长约 440px -->
    <g id="wheel">
      <circle r="70" fill="none" stroke="#1d232b" stroke-width="9"/>
      <circle r="60" fill="none" stroke="#cfd8dc" stroke-width="4"/>
      <g stroke="#9aa7b3" stroke-width="2.2">
        <g>
          <line x1="0" y1="-60" x2="0" y2="60"/>
          <line x1="-60" y1="0" x2="60" y2="0"/>
          <line x1="-42.4" y1="-42.4" x2="42.4" y2="42.4"/>
          <line x1="-42.4" y1="42.4" x2="42.4" y2="-42.4"/>
          <line x1="-23" y1="-55.4" x2="23" y2="55.4"/>
          <line x1="-55.4" y1="-23" x2="55.4" y2="23"/>
          <line x1="23" y1="-55.4" x2="-23" y2="55.4"/>
          <line x1="55.4" y1="-23" x2="-55.4" y2="23"/>
          <!-- 1.25s 转一圈 = 440px 周长，与路面虚线位移严格同步（不打滑） -->
          <animateTransform attributeName="transform" type="rotate"
                            from="0" to="360" dur="1.25s" repeatCount="indefinite"/>
        </g>
      </g>
      <circle cx="0" cy="-52" r="3.4" fill="#e63946"/>   <!-- 气门芯：让旋转可见 -->
      <circle r="7.5" fill="#41505b" stroke="#22303a" stroke-width="2"/>
    </g>
  </defs>

  <!-- ============ 天空 ============ -->

  <circle cx="762" cy="86" r="120" fill="url(#sunGlow)"/>
  <circle cx="762" cy="86" r="40" fill="#ffe066">
    <animate attributeName="r" values="40;43;40" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 云（视差滚动，两份拼接实现无缝循环） -->
  <g opacity=".92">
    <animateTransform attributeName="transform" type="translate"

      <use href="#cloud" transform="translate(430 58) scale(.8)" opacity=".85"/>

    <g transform="translate(900 0)">

      <use href="#cloud" transform="translate(430 58) scale(.8)" opacity=".85"/>
      <use href="#cloud" transform="translate(700 120) scale(1.25)"/>

    <animateTransform attributeName="transform" type="translate"

    <g fill="#9cbe7a" opacity=".85">

      <path d="M170 430 L330 300 L500 430 Z"/>
      <path d="M420 430 L560 340 L700 430 Z"/>

    <g transform="translate(900 0)" fill="#9cbe7a" opacity=".85">

      <path d="M170 430 L330 300 L500 430 Z"/>
      <path d="M420 430 L560 340 L700 430 Z"/>

  <text x="24" y="54" font-size="12" fill="#1b3a53" opacity=".55">

<div class="bar">
  <button id="toggle">暂停</button>
  <span class="hint">腿部关键帧由两圆相交 IK 实时求解，脚掌始终贴住脚踏。</span>
</div>

<script>
/* ---------- 腿部 IK：为 SMIL 生成膝关节弯曲的关键帧 ---------- */
(function () {
  const HIP = { x: 368, y: 258 };      // 髋关节（座垫上方）
  const BB  = { x: 430, y: 358 };      // 中轴 = 曲柄旋转中心
  const R   = 30;                      // 曲柄长度
  const L1  = 76, L2 = 79;             // 大腿 / 小腿
  const N   = 36;                      // 关键帧数

  const knee = (h, f) => {
    const dx = f.x - h.x, dy = f.y - h.y;
    const d  = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.5);
    const fx = h.x + dx / Math.hypot(dx, dy) * d;   // 超距时把脚往回收
    const fy = h.y + dy / Math.hypot(dx, dy) * d;
    const a  = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const hh = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const mx = h.x + a * (fx - h.x) / d, my = h.y + a * (fy - h.y) / d;
    const o1 = { x: mx - (fy - h.y) / d * hh, y: my + (fx - h.x) / d * hh };
    const o2 = { x: mx + (fy - h.y) / d * hh, y: my - (fx - h.x) / d * hh };
    return { k: o1.x > o2.x ? o1 : o2, f: { x: fx, y: fy } };   // 取前折的膝
  };

  const build = (phase) => {
    const ds = [];
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2 + phase;
      const pedal = { x: BB.x + R * Math.cos(a), y: BB.y + R * Math.sin(a) };
      const { k, f } = knee(HIP, pedal);
      ds.push(`M${HIP.x.toFixed(1)} ${HIP.y.toFixed(1)} ` +
              `L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${f.x.toFixed(1)} ${f.y.toFixed(1)}`);
    }
    return ds.join(';');
  };

  const near = document.getElementById('animNear');
  const far  = document.getElementById('animFar');
  near.setAttribute('values', build(0));
  far.setAttribute('values', build(Math.PI));   // 曲柄两侧相差 180°

  /* ---------- 暂停 / 继续 ---------- */
  const svg = document.getElementById('scene'), btn = document.getElementById('toggle');
  let paused = false;
  btn.onclick = () => {
    paused = !paused;
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    btn.textContent = paused ? '继续' : '暂停';
  };
})();
</script>
</body>
</html>
