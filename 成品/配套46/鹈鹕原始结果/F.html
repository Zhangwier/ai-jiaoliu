<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0e2233;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  svg { width: 100vw; height: 100vh; display: block; }

  /* ---------- 背景无缝滚动（宽1200的图案成对使用，平移-1200循环） ---------- */
  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
  .scroll-m    { animation: scrollX 40s  linear infinite; }
  .scroll-hf   { animation: scrollX 26s  linear infinite; }
  .scroll-hn   { animation: scrollX 15s  linear infinite; }
  .scroll-tuft { animation: scrollX 2.9s linear infinite; }
  .scroll-fg   { animation: scrollX 1.9s linear infinite; }

  /* ---------- 云 ---------- */
  @keyframes driftX { from { transform: translateX(1300px); } to { transform: translateX(-400px); } }
  .cloud { animation: driftX linear infinite; }
  .c1 { animation-duration: 30s; animation-delay: -6s; }
  .c2 { animation-duration: 42s; animation-delay: -20s; }
  .c3 { animation-duration: 24s; animation-delay: -13s; }
  .c4 { animation-duration: 52s; animation-delay: -34s; }

  /* ---------- 太阳 ---------- */
  .rays { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 远方飞鸟 ---------- */
  .flock { animation: driftX 46s linear infinite; animation-delay: -10s; }
  .flock-bob { animation: bobY 2.8s ease-in-out infinite alternate; }
  @keyframes bobY { from { transform: translateY(0); } to { transform: translateY(12px); } }

  /* ---------- 尘土 / 速度线 ---------- */
  .dust { transform-box: fill-box; transform-origin: center; animation: puff 1.3s linear infinite; }
  .d2 { animation-delay: .45s; }
  .d3 { animation-delay: .9s; }
  @keyframes puff {
    0%   { transform: translate(0,0) scale(.4); opacity: .5; }
    100% { transform: translate(-70px,-34px) scale(1.7); opacity: 0; }
  }
  .sline { animation: speedline .8s linear infinite; opacity: 0; }
  .s2 { animation-delay: .18s; animation-duration: .95s; }
  .s3 { animation-delay: .38s; animation-duration: 1.1s; }
  @keyframes speedline {
    0%   { opacity: 0; transform: translateX(14px); }
    45%  { opacity: .5; }
    100% { opacity: 0; transform: translateX(-30px); }
  }

  /* ---------- 眨眼 ---------- */
  #eyeInner { transform-box: fill-box; transform-origin: center; transition: transform .09s ease; }
  #eyeInner.blink { transform: scaleY(.1); }
</style>
</head>
<body>
<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <title>鹈鹕骑自行车</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#5cb8ee"/>
      <stop offset=".55" stop-color="#9fdcf7"/>
      <stop offset="1"   stop-color="#e8f7fd"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>

    <!-- 云朵 -->
    <g id="cloud" fill="#ffffff" opacity=".92">
      <ellipse cx="0"   cy="10"  rx="72" ry="20"/>
      <ellipse cx="46"  cy="-6"  rx="46" ry="18"/>
      <ellipse cx="-48" cy="-2"  rx="44" ry="16"/>
      <ellipse cx="12"  cy="-22" rx="38" ry="16"/>
      <ellipse cx="-16" cy="-16" rx="30" ry="13"/>
    </g>

    <!-- 远山（图案宽1200，成对使用实现无缝滚动） -->
    <g id="mountains">
      <path d="M-10,470 L110,330 L250,470 L390,348 L550,470 L690,322 L850,470 L990,342 L1130,470 L1210,470 L1210,700 L-10,700 Z"
            fill="#a3bccc" opacity=".85"/>
    </g>

    <!-- 远山树林 -->
    <g id="hillsFar">
      <path d="M-10,478 Q140,352 290,478 Q440,356 590,478 Q740,350 890,478 Q1040,358 1190,478 L1210,478 L1210,700 L-10,700 Z"
            fill="#a8cba4"/>
    </g>

    <!-- 近坡 + 树 -->
    <g id="tree">
      <path d="M-4,0 L-4,-26 L4,-26 L4,0 Z" fill="#7a5238"/>
      <circle cx="0"   cy="-40" r="21" fill="#3f7d52"/>
      <circle cx="-15" cy="-29" r="13" fill="#4c8f5e"/>
      <circle cx="15"  cy="-29" r="13" fill="#4c8f5e"/>
    </g>
    <g id="hillsNear">
      <path d="M-10,512 Q140,428 290,512 Q440,432 590,512 Q740,426 890,512 Q1040,434 1190,512 L1210,512 L1210,700 L-10,700 Z"
            fill="#79b673"/>
      <use href="#tree" transform="translate(110 508) scale(.8)"/>
      <use href="#tree" transform="translate(350 500) scale(1)"/>
      <use href="#tree" transform="translate(610 508) scale(.85)"/>
      <use href="#tree" transform="translate(860 500) scale(.95)"/>
      <use href="#tree" transform="translate(1090 504) scale(.75)"/>
    </g>

    <!-- 路边草丛 -->
    <path id="tuft" d="M0,0 Q4,-16 9,-2 M6,0 Q10,-12 16,-1 M2,1 Q-2,-10 -6,-2"
          fill="none" stroke="#4c8a52" stroke-width="3" stroke-linecap="round"/>
    <g id="tufts">
      <use href="#tuft" transform="translate(60 558)"/>
      <use href="#tuft" transform="translate(190 558)"/>
      <use href="#tuft" transform="translate(330 558)"/>
      <use href="#tuft" transform="translate(470 558)"/>
      <use href="#tuft" transform="translate(610 558)"/>
      <use href="#tuft" transform="translate(750 558)"/>
      <use href="#tuft" transform="translate(890 558)"/>
      <use href="#tuft" transform="translate(1030 558)"/>
      <use href="#tuft" transform="translate(1160 558)"/>
    </g>

    <!-- 前景快草（镜头最近，滚动最快） -->
    <g id="fgGrass" stroke="#3e7a4a" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M0,675 Q8,652 14,642 M10,675 Q18,650 26,644 M22,675 Q28,656 36,650"/>
      <path d="M180,675 Q188,650 194,640 M192,675 Q200,648 208,642"/>
      <path d="M420,675 Q428,652 434,642 M430,675 Q438,650 446,644"/>
      <path d="M640,675 Q648,650 654,640 M652,675 Q660,648 668,642"/>
      <path d="M840,675 Q848,652 854,642 M850,675 Q858,650 866,644"/>
      <path d="M1040,675 Q1048,650 1054,640 M1052,675 Q1060,648 1068,642"/>
      <g transform="translate(300 672)" stroke="#3e7a4a" stroke-width="3">
        <path d="M0,0 Q5,-16 3,-30"/>
        <circle cx="3" cy="-34" r="6" fill="#ffd34d" stroke="none"/>
        <circle cx="3" cy="-34" r="2.4" fill="#f28f3b" stroke="none"/>
      </g>
      <g transform="translate(760 672)" stroke="#3e7a4a" stroke-width="3">
        <path d="M0,0 Q-5,-16 -3,-30"/>
        <circle cx="-3" cy="-34" r="5" fill="#ff8fab" stroke="none"/>
        <circle cx="-3" cy="-34" r="2" fill="#e55770" stroke="none"/>
      </g>
    </g>

    <!-- 车架路径（两遍绘制：描边在下、主色在上） -->
    <g id="framePaths" fill="none" stroke-linecap="round">
      <path d="M455,480 L565,512"/>
      <path d="M455,480 L448,416"/>
      <path d="M448,416 L565,512"/>
      <path d="M565,512 L724,428"/>
      <path d="M452,418 L712,396"/>
      <path d="M712,392 L726,432"/>
      <path d="M726,430 C736,450 741,466 745,480"/>
      <path d="M712,392 L744,378"/>
      <path d="M744,378 L764,371"/>
    </g>

    <!-- 脚踏 / 脚蹼 -->
    <rect id="pedal" x="-15" y="-4.5" width="30" height="9" rx="3"
          fill="#2f333a" stroke="#17191d" stroke-width="2"/>
    <path id="footShape" d="M-8,-6 Q-14,0 -8,6 L2,8 L10,12 L16,5 L22,6 L14,-2 L20,-6 L8,-3 Z"
          stroke-linejoin="round"/>

    <!-- 身体裁剪（肚皮阴影用） -->
    <clipPath id="bodyClip">
      <ellipse cx="512" cy="372" rx="92" ry="64" transform="rotate(-6 512 372)"/>
    </clipPath>
  </defs>

  <!-- ======================= 背景 ======================= -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="990" cy="110" r="115" fill="url(#sunGlow)"/>
  <g class="rays" stroke="#ffe987" stroke-width="6" stroke-linecap="round" opacity=".9">
    <line x1="1062" y1="110" x2="1086" y2="110"/>
    <line x1="1040.9" y1="160.9" x2="1057.9" y2="177.9"/>
    <line x1="990" y1="182" x2="990" y2="206"/>
    <line x1="939.1" y1="160.9" x2="922.1" y2="177.9"/>
    <line x1="918" y1="110" x2="894" y2="110"/>
    <line x1="939.1" y1="59.1" x2="922.1" y2="42.1"/>
    <line x1="990" y1="38" x2="990" y2="14"/>
    <line x1="1040.9" y1="59.1" x2="1057.9" y2="42.1"/>
  </g>
  <circle cx="990" cy="110" r="52" fill="#ffe987"/>

  <!-- 飞鸟 -->
  <g class="flock">
    <g class="flock-bob">
      <g transform="translate(0 90)" fill="none" stroke="#6f93ad" stroke-width="2.5" stroke-linecap="round">
        <path d="M-24,0 Q-12,-12 0,0 Q12,-12 24,0"/>
        <path d="M46,26 Q58,14 70,26 Q82,14 94,26"/>
        <path d="M-84,40 Q-72,28 -60,40 Q-48,28 -36,40"/>
      </g>
    </g>
  </g>

  <!-- 云 -->
  <g class="cloud c1"><use href="#cloud" transform="translate(120 90) scale(1.15)"/></g>
  <g class="cloud c2"><use href="#cloud" transform="translate(520 150) scale(.8)"/></g>
  <g class="cloud c3"><use href="#cloud" transform="translate(820 70) scale(.95)"/></g>
  <g class="cloud c4"><use href="#cloud" transform="translate(300 190) scale(.65)"/></g>

  <!-- 山与树（视差滚动） -->
  <g class="scroll-m"><use href="#mountains" x="0"/><use href="#mountains" x="1200"/></g>
  <g class="scroll-hf"><use href="#hillsFar" x="0"/><use href="#hillsFar" x="1200"/></g>
  <g class="scroll-hn"><use href="#hillsNear" x="0"/><use href="#hillsNear" x="1200"/></g>

  <!-- 草地与路面 -->
  <rect x="0" y="520" width="1200" height="36" fill="#63a35e"/>
  <rect x="0" y="556" width="1200" height="5"  fill="#98a0a8"/>
  <rect x="0" y="560" width="1200" height="115" fill="#70767e"/>
  <rect x="0" y="560" width="1200" height="5"  fill="#7f868f"/>
  <line x1="0" y1="566" x2="1200" y2="566" stroke="#aab2ba" stroke-width="2" opacity=".6"/>
  <line id="roadDash" x1="0" y1="622" x2="1200" y2="622"
        stroke="#f2d24b" stroke-width="7" stroke-dasharray="46 34"/>

  <g class="scroll-tuft"><use href="#tufts" x="0"/><use href="#tufts" x="1200"/></g>

  <!-- 地面阴影 -->
  <ellipse cx="600" cy="566" rx="255" ry="12" fill="#1c2126" opacity=".18"/>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line class="sline"    x1="300" y1="428" x2="362" y2="428"/>
    <line class="sline s2" x1="278" y1="460" x2="346" y2="460"/>
    <line class="sline s3" x1="308" y1="492" x2="374" y2="492"/>
  </g>

  <!-- 后轮尘土 -->
  <g fill="#d7dee4">
    <circle class="dust"    cx="432" cy="556" r="7"/>
    <circle class="dust d2" cx="446" cy="558" r="5"/>
    <circle class="dust d3" cx="420" cy="554" r="6"/>
  </g>

  <g class="scroll-fg"><use href="#fgGrass" x="0"/><use href="#fgGrass" x="1200"/></g>

  <!-- ======================= 鹈鹕 · 远侧腿（车架之后） ======================= -->
  <path id="legFarT"  d="" fill="none" stroke="#b97a3e" stroke-width="18" stroke-linecap="round"/>
  <path id="legFarTm" d="" fill="none" stroke="#dd9150" stroke-width="13" stroke-linecap="round"/>
  <path id="legFarS"  d="" fill="none" stroke="#b97a3e" stroke-width="12" stroke-linecap="round"/>
  <path id="legFarSm" d="" fill="none" stroke="#dd9150" stroke-width="8"  stroke-linecap="round"/>
  <circle id="kneeFar" r="4.5" fill="#dd9150" stroke="#b97a3e" stroke-width="2"/>
  <g id="footFar"><use href="#footShape" fill="#dd9150" stroke="#b97a3e" stroke-width="2"/></g>

  <!-- 远侧曲柄 + 脚踏 -->
  <g id="crankFar"><line x1="565" y1="512" x2="601" y2="512" stroke="#3f454d" stroke-width="8" stroke-linecap="round"/></g>
  <use id="pedalFar" href="#pedal"/>

  <!-- ======================= 自行车 ======================= -->
  <g>
    <!-- 后轮 -->
    <circle cx="455" cy="480" r="80" fill="none" stroke="#2f333a" stroke-width="13"/>
    <circle cx="455" cy="480" r="70" fill="none" stroke="#aeb9c2" stroke-width="5"/>
    <g id="rearSpokes" stroke="#dde5ea" stroke-width="2.5" opacity=".9">
      <line x1="455" y1="480" x2="519"   y2="480"/>
      <line x1="455" y1="480" x2="506.8" y2="517.6"/>
      <line x1="455" y1="480" x2="474.8" y2="540.7"/>
      <line x1="455" y1="480" x2="435.2" y2="540.7"/>
      <line x1="455" y1="480" x2="403.2" y2="517.6"/>
      <line x1="455" y1="480" x2="391"   y2="480"/>
      <line x1="455" y1="480" x2="403.2" y2="442.4"/>
      <line x1="455" y1="480" x2="435.2" y2="419.3"/>
      <line x1="455" y1="480" x2="474.8" y2="419.3"/>
      <line x1="455" y1="480" x2="506.8" y2="442.4"/>
    </g>
    <circle cx="455" cy="480" r="8" fill="#6b7480" stroke="#2f333a" stroke-width="3"/>
    <!-- 前轮 -->
    <circle cx="745" cy="480" r="80" fill="none" stroke="#2f333a" stroke-width="13"/>
    <circle cx="745" cy="480" r="70" fill="none" stroke="#aeb9c2" stroke-width="5"/>
    <g id="frontSpokes" stroke="#dde5ea" stroke-width="2.5" opacity=".9">
      <line x1="745" y1="480" x2="809"   y2="480"/>
      <line x1="745" y1="480" x2="796.8" y2="517.6"/>
      <line x1="745" y1="480" x2="764.8" y2="540.7"/>
      <line x1="745" y1="480" x2="725.2" y2="540.7"/>
      <line x1="745" y1="480" x2="693.2" y2="517.6"/>
      <line x1="745" y1="480" x2="681"   y2="480"/>
      <line x1="745" y1="480" x2="693.2" y2="442.4"/>
      <line x1="745" y1="480" x2="725.2" y2="419.3"/>
      <line x1="745" y1="480" x2="764.8" y2="419.3"/>
      <line x1="745" y1="480" x2="796.8" y2="442.4"/>
    </g>
    <circle cx="745" cy="480" r="8" fill="#6b7480" stroke="#2f333a" stroke-width="3"/>
    <!-- 车架 -->
    <use href="#framePaths" stroke="#a33240" stroke-width="12"/>
    <use href="#framePaths" stroke="#d64550" stroke-width="9"/>
    <!-- 车把套 -->
    <line x1="750" y1="374" x2="768" y2="369" stroke="#2f333a" stroke-width="13" stroke-linecap="round"/>
    <!-- 车座 -->
    <path d="M424,414 Q448,405 474,411 Q477,419 470,424 L430,425 Q421,421 424,414 Z"
          fill="#3a3f47" stroke="#23272d" stroke-width="2"/>
    <!-- 链条与牙盘 -->
    <path d="M565,499 L456,480 M565,525 L456,480" fill="none" stroke="#4d545c" stroke-width="3"/>
    <circle cx="565" cy="512" r="13" fill="none" stroke="#4d545c" stroke-width="4"/>
  </g>

  <!-- 近侧曲柄 + 脚踏 -->
  <g id="crankNear"><line x1="565" y1="512" x2="601" y2="512" stroke="#3f454d" stroke-width="8" stroke-linecap="round"/></g>
  <use id="pedalNear" href="#pedal"/>

  <!-- ======================= 鹈鹕 · 近侧腿 ======================= -->
  <path id="legNearT"  d="" fill="none" stroke="#d98a3a" stroke-width="20" stroke-linecap="round"/>
  <path id="legNearTm" d="" fill="none" stroke="#f4a259" stroke-width="15" stroke-linecap="round"/>
  <path id="legNearS"  d="" fill="none" stroke="#d98a3a" stroke-width="14" stroke-linecap="round"/>
  <path id="legNearSm" d="" fill="none" stroke="#f4a259" stroke-width="10" stroke-linecap="round"/>
  <circle id="kneeNear" r="5" fill="#f4a259" stroke="#d98a3a" stroke-width="2"/>
  <g id="footNear"><use href="#footShape" fill="#f4a259" stroke="#d98a3a" stroke-width="2"/></g>

  <!-- ======================= 鹈鹕身体（整体随踩踏轻颤） ======================= -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M436,352 L392,330 L402,348 L386,342 L404,366 L390,368 L420,392 L436,382 Z"
          fill="#f2f6f9" stroke="#c7d3dd" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="512" cy="372" rx="92" ry="64" transform="rotate(-6 512 372)"
             fill="#ffffff" stroke="#c7d3dd" stroke-width="3"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="520" cy="400" rx="66" ry="34" fill="#e9eff4"/>
    </g>
    <path d="M436,344 Q512,312 592,342" fill="none" stroke="#d5dee6" stroke-width="3" opacity=".8"/>
    <path d="M540,400 q10,10 22,8 M544,414 q12,8 24,4 M550,428 q10,6 20,2"
          fill="none" stroke="#d9e2e9" stroke-width="2.5"/>
    <!-- 收拢的远侧翅影 -->
    <path d="M470,330 Q540,318 590,352 Q540,352 472,344 Z" fill="#e9eef3" stroke="#c7d3dd" stroke-width="2"/>

    <!-- 脖子与头（随踩踏摇头） -->
    <g id="neckHead">
      <path d="M572,330 C604,322 626,282 648,234" fill="none" stroke="#c7d3dd" stroke-width="34" stroke-linecap="round"/>
      <path d="M572,330 C604,322 626,282 648,234" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
      <g id="headG" transform="translate(662 222)">
        <!-- 头冠 -->
        <path d="M-20,-12 Q-30,-20 -36,-24 M-18,-18 Q-26,-28 -30,-34 M-14,-22 Q-18,-32 -20,-38"
              fill="none" stroke="#c7d3dd" stroke-width="3" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="26" fill="#ffffff" stroke="#c7d3dd" stroke-width="3"/>
        <!-- 上喙 -->
        <path d="M6,-9 Q95,-4 178,28 Q180,34 172,36 Q92,12 4,8 Z"
              fill="#f4a259" stroke="#d98a3a" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M12,-5 Q95,0 174,28" fill="none" stroke="#d98a3a" stroke-width="2" opacity=".55"/>
        <ellipse cx="30" cy="-4" rx="3" ry="1.5" fill="#c97a30"/>
        <!-- 喉囊（抖动） -->
        <g id="pouchG">
          <path d="M8,2 C14,56 56,84 98,76 C142,67 172,44 178,30 C132,26 68,16 8,2 Z"
                fill="#f7bd85" stroke="#e09a5f" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- 囊里露出的小鱼尾巴 -->
          <g id="fishTail">
            <path d="M96,64 L92,80 L100,86 L106,78 L114,84 L110,66 L116,56 L102,62 Z"
                  fill="#8fc1d4" stroke="#5f93ab" stroke-width="2" stroke-linejoin="round"/>
          </g>
        </g>
        <!-- 眼睛 -->
        <g id="eyeG">
          <g id="eyeInner">
            <circle cx="-2" cy="-6" r="7.5" fill="#ffffff" stroke="#d0d8df" stroke-width="1.5"/>
            <circle cx="0.6" cy="-6.4" r="3.8" fill="#20242a"/>
            <circle cx="-1.2" cy="-8" r="1.5" fill="#ffffff"/>
          </g>
        </g>
      </g>
    </g>

    <!-- 围巾 -->
    <ellipse cx="604" cy="308" rx="13" ry="30" transform="rotate(-46 604 308)"
             fill="#e6484f" stroke="#b02f37" stroke-width="2"/>
    <circle cx="615" cy="316" r="6.5" fill="#e6484f" stroke="#b02f37" stroke-width="2"/>
    <path id="scarfTail" d="" fill="#e6484f" stroke="#b02f37" stroke-width="2" stroke-linejoin="round"/>

    <!-- 翅膀（扶在车把上） -->
    <path id="wingEdge" d="" fill="none" stroke="#c7d3dd" stroke-width="26" stroke-linecap="round"/>
    <path id="wingPath"  d="" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <path d="M645,346 q8,6 -2,12 M703,355 q8,6 -2,12" fill="none" stroke="#d5dee6" stroke-width="2.5"/>
    <g id="wingTip">
      <path d="M0,0 Q7,7 3,13 M0,0 Q11,2 13,-5 M0,0 Q13,8 17,11"
            fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 字幕 -->
  <text x="1176" y="662" text-anchor="end" font-family="system-ui, sans-serif"
        font-size="17" fill="#ffffff" opacity=".75">鹈鹕骑行 · Pelican on a Bike — SVG 2D 动画</text>
</svg>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rearSpokes = $('rearSpokes'), frontSpokes = $('frontSpokes');
  var crankNear = $('crankNear'), crankFar = $('crankFar');
  var pedalNear = $('pedalNear'), pedalFar = $('pedalFar');
  var legNearT = $('legNearT'), legNearTm = $('legNearTm'), legNearS = $('legNearS'), legNearSm = $('legNearSm');
  var legFarT  = $('legFarT'),  legFarTm  = $('legFarTm'),  legFarS  = $('legFarS'),  legFarSm  = $('legFarSm');
  var kneeNear = $('kneeNear'), kneeFar = $('kneeFar');
  var footNear = $('footNear'), footFar = $('footFar');
  var pelican = $('pelican'), neckHead = $('neckHead'), headG = $('headG');
  var wingEdge = $('wingEdge'), wingPath = $('wingPath'), wingTip = $('wingTip');
  var scarfTail = $('scarfTail'), pouchG = $('pouchG'), fishTail = $('fishTail');
  var roadDash = $('roadDash'), eyeInner = $('eyeInner');

  var BB = { x: 565, y: 512 }, CRANK_R = 36;      // 五通、曲柄长
  var HIP_N = { x: 548, y: 402 }, HIP_F = { x: 526, y: 396 };  // 髋关节
  var LN = [74, 82], LF = [72, 84];               // 大腿/小腿长
  var WHEEL_R = 80, GEAR = 1.05, SPEED = 420;     // 轮半径、传动比、速度 px/s
  var GRIP = { x: 760, y: 373 };                  // 车把握点

  var dist = 0, last = performance.now(), t = 0;

  /* 两段式逆运动学：给定髋、脚，求膝（膝盖向后弯，像鸟腿） */
  function solveKnee(hx, hy, fx, fy, l1, l2) {
    var dx = fx - hx, dy = fy - hy;
    var od = Math.hypot(dx, dy) || 0.0001;
    var d = Math.min(Math.max(od, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
    var ux = dx / od, uy = dy / od;
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
    var bx = hx + ux * a, by = hy + uy * a;
    var k1 = { x: bx - uy * h, y: by + ux * h };
    var k2 = { x: bx + uy * h, y: by - ux * h };
    return k1.x <= k2.x ? k1 : k2;
  }
  function seg(el, x1, y1, x2, y2) {
    el.setAttribute('d', 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' L' + x2.toFixed(1) + ',' + y2.toFixed(1));
  }

  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    t += dt; dist += SPEED * dt;
    var crank = dist / (WHEEL_R * GEAR);            // 曲柄角（弧度）
    var wdeg = dist / WHEEL_R * 180 / Math.PI;      // 车轮转角
    var cdeg = crank * 180 / Math.PI;

    /* 车轮与曲柄 */
    rearSpokes.setAttribute('transform', 'rotate(' + wdeg + ' 455 480)');
    frontSpokes.setAttribute('transform', 'rotate(' + wdeg + ' 745 480)');
    crankNear.setAttribute('transform', 'rotate(' + cdeg + ' 565 512)');
    crankFar.setAttribute('transform', 'rotate(' + (cdeg + 180) + ' 565 512)');

    /* 脚踏位置（近侧/远侧相差半圈） */
    var pN = { x: BB.x + CRANK_R * Math.cos(crank), y: BB.y + CRANK_R * Math.sin(crank) };
    var pF = { x: BB.x - CRANK_R * Math.cos(crank), y: BB.y - CRANK_R * Math.sin(crank) };
    pedalNear.setAttribute('transform', 'translate(' + pN.x.toFixed(1) + ' ' + pN.y.toFixed(1) + ')');
    pedalFar.setAttribute('transform',  'translate(' + pF.x.toFixed(1) + ' ' + pF.y.toFixed(1) + ')');

    /* 身体随踩踏上下颤（频率为曲柄两倍） */
    var bob = Math.sin(crank * 2) * 3.4;
    pelican.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

    /* 近侧腿 */
    var hipN = { x: HIP_N.x, y: HIP_N.y + bob };
    var kN = solveKnee(hipN.x, hipN.y, pN.x, pN.y, LN[0], LN[1]);
    seg(legNearT,  hipN.x, hipN.y, kN.x, kN.y);
    seg(legNearTm, hipN.x, hipN.y, kN.x, kN.y);
    seg(legNearS,  kN.x, kN.y, pN.x, pN.y);
    seg(legNearSm, kN.x, kN.y, pN.x, pN.y);
    kneeNear.setAttribute('transform', 'translate(' + kN.x.toFixed(1) + ' ' + kN.y.toFixed(1) + ')');
    var aN = Math.atan2(pN.y - kN.y, pN.x - kN.x) * 180 / Math.PI;
    footNear.setAttribute('transform',
      'translate(' + pN.x.toFixed(1) + ' ' + pN.y.toFixed(1) + ') rotate(' + (aN * 0.3 + 14).toFixed(1) + ')');

    /* 远侧腿 */
    var hipF = { x: HIP_F.x, y: HIP_F.y + bob };
    var kF = solveKnee(hipF.x, hipF.y, pF.x, pF.y, LF[0], LF[1]);
    seg(legFarT,  hipF.x, hipF.y, kF.x, kF.y);
    seg(legFarTm, hipF.x, hipF.y, kF.x, kF.y);
    seg(legFarS,  kF.x, kF.y, pF.x, pF.y);
    seg(legFarSm, kF.x, kF.y, pF.x, pF.y);
    kneeFar.setAttribute('transform', 'translate(' + kF.x.toFixed(1) + ' ' + kF.y.toFixed(1) + ')');
    var aF = Math.atan2(pF.y - kF.y, pF.x - kF.x) * 180 / Math.PI;
    footFar.setAttribute('transform',
      'translate(' + pF.x.toFixed(1) + ' ' + pF.y.toFixed(1) + ') rotate(' + (aF * 0.3 + 14).toFixed(1) + ')');

    /* 头颈摆动 */
    neckHead.setAttribute('transform', 'rotate(' + (Math.sin(crank * 2 + 0.6) * 2.6).toFixed(2) + ' 572 330)');
    var hb = Math.sin(crank * 2 + 2.1) * 2.2;
    headG.setAttribute('transform',
      'translate(662 ' + (222 + hb).toFixed(2) + ') rotate(' + (Math.sin(crank * 2 + 1.4) * 2).toFixed(2) + ')');

    /* 喉囊抖动 + 小鱼摆尾 */
    pouchG.setAttribute('transform', 'rotate(' + (Math.sin(crank * 2 + 1.2) * 3).toFixed(2) + ' 8 4)');
    fishTail.setAttribute('transform', 'rotate(' + (Math.sin(t * 9) * 12).toFixed(1) + ' 96 64)');

    /* 翅膀扶把（端点随手把，肩随身体） */
    var gy = GRIP.y - bob;
    var wd = 'M594,348 C652,350 706,362 ' + GRIP.x + ',' + gy.toFixed(1);
    wingEdge.setAttribute('d', wd);
    wingPath.setAttribute('d', wd);
    wingTip.setAttribute('transform', 'translate(' + (GRIP.x - 2) + ' ' + gy.toFixed(1) + ')');

    /* 围巾飘动 */
    var w = t * 6;
    var y1 = 282 + Math.sin(w) * 7;
    var y2 = 292 + Math.sin(w + 1.1) * 7;
    var y3 = 306 + Math.sin(w + 0.5) * 7;
    scarfTail.setAttribute('d',
      'M616,308 C584,298 546,290 512,' + y1.toFixed(1) +
      ' C542,' + y2.toFixed(1) + ' 580,' + y3.toFixed(1) + ' 616,324 Z');

    /* 路面虚线随速度滚动 */
    roadDash.style.strokeDashoffset = (-(dist % 80)).toFixed(1);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* 随机眨眼 */
  (function blink() {
    setTimeout(function () {
      eyeInner.classList.add('blink');
      setTimeout(function () { eyeInner.classList.remove('blink'); }, 150);
      blink();
    }, 2200 + Math.random() * 3200);
  })();
})();
</script>
</body>
</html>
